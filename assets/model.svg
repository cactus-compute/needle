<text x="210" y="302" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">from 4 layers (29M) up the tuned subnetwork passes DeepSeek V4 Flash</text>
</g>
<line x1="40" y1="316" x2="860" y2="316" stroke="#232326" stroke-width="1"/>
