<g class="s r0">
<text x="40" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">INPUTS</text>
<text x="210" y="90" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">Text prompts, plus tool definitions or an extraction schema</text>
</g>
<line class="s l1" x1="40" y1="104" x2="860" y2="104" stroke="#232326" stroke-width="1"/>
<g class="s r1">
<text x="40" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">OUTPUTS</text>
<text x="210" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">Tool calls or structured extraction, always well-formed</text>
</g>
<line class="s l2" x1="40" y1="142" x2="860" y2="142" stroke="#232326" stroke-width="1"/>
<g class="s r2">
<text x="40" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">MODEL</text>
<text x="210" y="166" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">29-121M Laddered Simple Attention Networks, CQ2 quantisation</text>
</g>
<line class="s l3" x1="40" y1="180" x2="860" y2="180" stroke="#232326" stroke-width="1"/>
