<text x="210" y="204" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e8e6df">360B tokens of proprietary structured dataset</text>
</g>
<line class="s l4" x1="40" y1="218" x2="860" y2="218" stroke="#232326" stroke-width="1"/>
<g class="s r4">
<text x="40" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#e8593d">SPEED</text>
