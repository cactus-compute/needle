<rect width="900" height="346" rx="18" fill="#0e0e10"/>
<text x="40" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8e6df">Needle 3 at a glance</text>
